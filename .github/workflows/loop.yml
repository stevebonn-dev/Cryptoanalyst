<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HeavyDuty Workout Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: { 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
  <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navigation -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🏋️‍♂️</span>
        <h1 class="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">HeavyDuty</h1>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="finishAndSaveWorkout()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white transition shadow flex items-center space-x-1">
          <span>✓</span>
          <span>Complete Workout</span>
        </button>
        <button onclick="toggleCreatine()" id="creatine-btn" class="px-3 py-1.5 text-xs font-bold rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 transition">
          Logged: 0g
        </button>
        <button onclick="toggleTheme()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
          <span id="theme-icon">🌙 Dark</span>
        </button>
        <button onclick="openSettingsModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
          ⚙️ Settings
        </button>
        <button id="sync_button" onclick="syncWithDrive()" class="hidden px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-500 hover:bg-amber-600 text-slate-900 transition">
          🔄 Sync Drive
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="max-w-4xl mx-auto px-4 flex space-x-2 border-t border-slate-100 dark:border-slate-700/50 pt-2 pb-2">
      <button data-tab="dashboard" class="nav-btn px-4 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-900 transition">Dashboard</button>
      <button data-tab="workout" class="nav-btn px-4 py-2 text-xs font-bold rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Workout Log</button>
      <button data-tab="history" class="nav-btn px-4 py-2 text-xs font-bold rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition">History</button>
    </nav>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- TAB 1: DASHBOARD -->
    <section id="dashboard" class="tab-content active space-y-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">Workout Routines</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Select a split or start a new template</p>
        </div>
        <button onclick="createNewDay()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-xl shadow transition">
          + New Routine Day
        </button>
      </div>

      <div id="workout-days-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- TAB 2: WORKOUT LOG / EDITOR -->
    <section id="workout" class="tab-content space-y-6">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <input type="text" id="active-day-title" onchange="updateDayTitle(this.value)" class="text-xl font-extrabold bg-transparent text-slate-900 dark:text-white focus:outline-none border-b border-transparent focus:border-amber-500 w-full sm:w-auto" placeholder="Routine Name" />
          
          <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
            <button onclick="addExerciseToActiveDay()" class="px-3 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-xs font-bold text-slate-800 dark:text-slate-200 rounded-lg">
              + Add Exercise
            </button>
            <button onclick="finishAndSaveWorkout()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-lg shadow">
              ✓ Save & Complete Workout
            </button>
          </div>
        </div>

        <!-- Timer Tool -->
        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-900 p-3 rounded-lg border border-slate-200 dark:border-slate-700 text-xs">
          <div class="flex items-center space-x-2">
            <span class="font-bold">Rest Timer:</span>
            <span id="timer-display" class="font-mono text-base font-extrabold text-amber-500">01:30</span>
          </div>
          <div class="flex items-center space-x-2">
            <input type="number" id="timer-input-seconds" value="90" class="w-16 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-center font-bold text-slate-900 dark:text-white" />
            <span class="text-slate-400">sec</span>
            <button onclick="startTimer()" class="px-2.5 py-1 bg-amber-500 text-slate-900 font-bold rounded">Start</button>
            <button onclick="pauseTimer()" class="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 font-semibold rounded">Pause</button>
            <button onclick="resetTimer()" class="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 font-semibold rounded">Reset</button>
          </div>
        </div>
      </div>

      <div id="exercises-list" class="space-y-4"></div>
    </section>

    <!-- TAB 3: HISTORY -->
    <section id="history" class="tab-content space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Logged History</h2>
        <button onclick="clearHistory()" class="px-3 py-1.5 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 font-bold text-xs rounded-lg hover:bg-red-200">
          Clear History
        </button>
      </div>
      <div id="history-list" class="space-y-4"></div>
    </section>

  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 space-y-5 border border-slate-200 dark:border-slate-700 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
        <h3 class="font-bold text-lg text-slate-900 dark:text-white">Cloud Sync Settings</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">✕</button>
      </div>

      <div class="p-3 rounded-lg border text-xs flex items-center justify-between" id="sync-status-box">
        <div class="flex items-center space-x-2">
          <span id="sync-status-icon">⚪</span>
          <span id="sync-status-text" class="font-semibold text-slate-600 dark:text-slate-300">Drive Sync: Not Configured</span>
        </div>
        <span id="sync-last-time" class="text-[10px] text-slate-400"></span>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Google OAuth Client ID</label>
          <input type="text" id="setting-client-id" placeholder="123456789-xxx.apps.googleusercontent.com" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-mono text-[11px]" />
        </div>
        <div>
          <label class="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Google API Key</label>
          <input type="password" id="setting-api-key" placeholder="AIzaSy..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-2.5 text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 font-mono text-[11px]" />
        </div>
      </div>

      <div class="flex space-x-3 pt-2">
        <button onclick="saveSettings()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-xl shadow transition">
          Save Credentials
        </button>
        <button onclick="downloadLocalBackup()" class="w-full py-2.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-800 dark:text-slate-200 font-bold text-xs rounded-xl transition">
          📥 Export Backup
        </button>
      </div>
    </div>
  </div>

  <!-- Conflict Resolution Modal -->
  <div id="conflict-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-5 border border-slate-200 dark:border-slate-700 shadow-2xl">
      <div class="border-b border-slate-100 dark:border-slate-700 pb-3">
        <h3 class="font-extrabold text-lg text-amber-500 flex items-center space-x-2">
          <span>⚠️</span> Data Version Conflict Detected
        </h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          Your cloud storage and local storage versions do not match. Select which version you would like to keep.
        </p>
      </div>

      <div class="grid grid-cols-2 gap-4 text-xs">
        <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2">
          <span class="font-bold text-slate-900 dark:text-white block">💻 Local Storage</span>
          <p class="text-slate-500">Last Workout Date:</p>
          <p id="conflict-local-date" class="font-mono font-bold text-amber-500">--</p>
          <p id="conflict-local-count" class="text-[11px] text-slate-400">0 sessions stored</p>
        </div>

        <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2">
          <span class="font-bold text-slate-900 dark:text-white block">☁️ Cloud Backup</span>
          <p class="text-slate-500">Last Workout Date:</p>
          <p id="conflict-cloud-date" class="font-mono font-bold text-amber-500">--</p>
          <p id="conflict-cloud-count" class="text-[11px] text-slate-400">0 sessions stored</p>
        </div>
      </div>

      <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-lg text-xs text-amber-600 dark:text-amber-400 font-semibold" id="conflict-diff-summary">
        Difference: --
      </div>

      <div class="flex space-x-3 pt-2">
        <button id="btn-use-local" class="w-full py-2.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-800 dark:text-slate-200 font-bold text-xs rounded-xl transition">
          Use Local Version
        </button>
        <button id="btn-use-cloud" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-xl shadow transition">
          Use Cloud Version
        </button>
      </div>
    </div>
  </div>

  <script>
    const initialDays = [
      {
        id: 'day_1',
        title: 'Workout Day 1 (Chest & Arms)',
        exercises: [
          {
            id: 'ex_1', name: 'Incline Press', notes: 'Keep elbows slightly tucked', superset: false, cableSides: 'None', cableHeight: 0,
            sets: [{ reps: 10, weight: 20, completed: false, lastReps: 10, lastWeight: 20 }, { reps: 8, weight: 25, completed: false, lastReps: 8, lastWeight: 25 }]
          },
          {
            id: 'ex_2', name: 'Cable Crossover', notes: 'Squeeze chest at peak contraction', superset: true, cableSides: 'Dual', cableHeight: 16,
            sets: [{ reps: 12, weight: 10, completed: false, lastReps: 12, lastWeight: 10 }, { reps: 10, weight: 12, completed: false, lastReps: 10, lastWeight: 12 }]
          }
        ]
      },
      {
        id: 'day_2',
        title: 'Workout Day 2 (Back & Rear Delts)',
        exercises: [
          {
            id: 'ex_3', name: 'Lat Pull-Downs', notes: 'Full stretch at top', superset: false, cableSides: 'Dual', cableHeight: 31,
            sets: [{ reps: 10, weight: 30, completed: false, lastReps: 10, lastWeight: 30 }, { reps: 8, weight: 30, completed: false, lastReps: 8, lastWeight: 30 }]
          }
        ]
      },
      {
        id: 'day_3',
        title: 'Workout Day 3 (Legs & Abs)',
        exercises: [
          {
            id: 'ex_4', name: 'Leg Press', notes: 'Controlled eccentric tempo', superset: false, cableSides: 'None', cableHeight: 0,
            sets: [{ reps: 10, weight: 30, completed: false, lastReps: 10, lastWeight: 30 }, { reps: 8, weight: 30, completed: false, lastReps: 8, lastWeight: 30 }]
          }
        ]
      }
    ];

    function initTheme() {
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').innerText = '☀️ Light';
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').innerText = '🌙 Dark';
      }
    }

    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('theme-icon').innerText = '☀️ Light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('theme-icon').innerText = '🌙 Dark';
      }
    }

    function getWorkoutDays() {
      const stored = localStorage.getItem('workout_days');
      return stored ? JSON.parse(stored) : initialDays;
    }

    function saveWorkoutDays(days) {
      localStorage.setItem('workout_days', JSON.stringify(days));
    }

    let activeDayId = 'day_1';
    let timerInterval = null;
    let timerTimeLeft = 90;

    function startTimer() {
      clearInterval(timerInterval);
      const inputVal = parseInt(document.getElementById('timer-input-seconds').value) || 90;
      if (timerTimeLeft <= 0 || timerTimeLeft === 90) timerTimeLeft = inputVal;

      timerInterval = setInterval(() => {
        timerTimeLeft--;
        updateTimerDisplay();
        if (timerTimeLeft <= 0) {
          clearInterval(timerInterval);
          playAlarmSound();
          alert('Rest period ended!');
          resetTimer();
        }
      }, 1000);
    }

    function pauseTimer() { clearInterval(timerInterval); }

    function resetTimer() {
      clearInterval(timerInterval);
      const inputVal = parseInt(document.getElementById('timer-input-seconds').value) || 90;
      timerTimeLeft = inputVal;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerTimeLeft / 60);
      const secs = timerTimeLeft % 60;
      document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function playAlarmSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log('Audio alert error:', e);
      }
    }

    function renderDashboard() {
      const days = getWorkoutDays();
      const container = document.getElementById('workout-days-container');
      
      container.innerHTML = days.map(d => `
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between space-y-4">
          <div>
            <h3 class="font-bold text-lg text-slate-900 dark:text-white mb-1">${d.title}</h3>
            <p class="text-xs text-amber-500 font-semibold">${d.exercises.length} Exercises Configured</p>
            <ul class="text-xs text-slate-500 dark:text-slate-400 mt-3 space-y-1">
              ${d.exercises.slice(0, 3).map(e => `<li>• ${e.name}</li>`).join('')}
              ${d.exercises.length > 3 ? `<li class="text-slate-400 dark:text-slate-500">+ ${d.exercises.length - 3} more...</li>` : ''}
            </ul>
          </div>
          <div class="flex items-center space-x-2 pt-2 border-t border-slate-100 dark:border-slate-700">
            <button onclick="openWorkoutDay('${d.id}')" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-lg transition">
              Open & Track
            </button>
            <button onclick="deleteWorkoutDay('${d.id}')" class="px-2.5 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 font-bold text-xs rounded-lg hover:bg-red-200">
              🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    function openWorkoutDay(dayId) {
      activeDayId = dayId;
      switchTab('workout');
    }

    function createNewDay() {
      const days = getWorkoutDays();
      const newId = 'day_' + Date.now();
      const newDay = { id: newId, title: `Workout Day ${days.length + 1}`, exercises: [] };
      days.push(newDay);
      saveWorkoutDays(days);
      renderDashboard();
      openWorkoutDay(newId);
    }

    function deleteWorkoutDay(dayId) {
      if (confirm('Delete this workout day routine?')) {
        let days = getWorkoutDays().filter(d => d.id !== dayId);
        saveWorkoutDays(days);
        renderDashboard();
      }
    }

    // Helper options for dropdown menus (1-step increments)
    const repsOptions = Array.from({ length: 35 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
    const weightOptions = Array.from({ length: 30 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');

    function renderWorkoutEditor() {
      const days = getWorkoutDays();
      const activeDay = days.find(d => d.id === activeDayId) || days[0];
      if (!activeDay) return;

      document.getElementById('active-day-title').value = activeDay.title;
      const container = document.getElementById('exercises-list');

      if (activeDay.exercises.length === 0) {
        container.innerHTML = `<div class="p-8 text-center bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400">No exercises added yet. Click "+ Add Exercise" above to start building this session.</div>`;
        return;
      }

      container.innerHTML = activeDay.exercises.map((ex, index) => `
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl border ${ex.superset ? 'border-amber-500' : 'border-slate-200 dark:border-slate-700'} shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
            <div class="flex items-center space-x-2 flex-grow">
              <span class="text-xs font-bold text-slate-400">#${index + 1}</span>
              <input type="text" value="${ex.name}" onchange="updateExerciseName('${ex.id}', this.value)" class="bg-transparent font-bold text-base text-slate-900 dark:text-white focus:outline-none focus:border-amber-500 border-b border-transparent w-full" />
              ${ex.superset ? '<span class="text-[10px] bg-amber-500 text-slate-900 font-extrabold px-2 py-0.5 rounded uppercase">Superset</span>' : ''}
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="toggleSuperset('${ex.id}')" class="px-2 py-1 text-xs font-semibold rounded border ${ex.superset ? 'bg-amber-500/20 text-amber-500 border-amber-500' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700'}">
                ${ex.superset ? '✓ Superset' : 'Link Superset'}
              </button>
              <button onclick="moveExercise('${ex.id}', -1)" class="p-1 bg-slate-200 dark:bg-slate-800 text-xs rounded border border-slate-300 dark:border-slate-700">▲</button>
              <button onclick="moveExercise('${ex.id}', 1)" class="p-1 bg-slate-200 dark:bg-slate-800 text-xs rounded border border-slate-300 dark:border-slate-700">▼</button>
              <button onclick="removeExercise('${ex.id}')" class="p-1 text-red-500 text-xs hover:underline">Remove</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div class="flex items-center space-x-2">
              <label class="text-slate-500 dark:text-slate-400">Cable Setup:</label>
              <select onchange="updateCableSetting('${ex.id}', 'cableSides', this.value)" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-900 dark:text-white">
                <option value="None" ${ex.cableSides==='None'?'selected':''}>N/A (Free Weight / Machine)</option>
                <option value="Single" ${ex.cableSides==='Single'?'selected':''}>Single Side</option>
                <option value="Dual" ${ex.cableSides==='Dual'?'selected':''}>Both Sides (Dual)</option>
              </select>
            </div>
            <div class="flex items-center space-x-2">
              <label class="text-slate-500 dark:text-slate-400">Cable Height Pin (0-31):</label>
              <select onchange="updateCableSetting('${ex.id}', 'cableHeight', parseInt(this.value))" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-slate-900 dark:text-white font-mono font-bold">
                ${Array.from({ length: 32 }, (_, i) => `<option value="${i}" ${ex.cableHeight === i ? 'selected' : ''}>${i}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="space-y-2">
            <div class="grid grid-cols-12 text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase px-2 items-center">
              <span class="col-span-2">Set</span>
              <span class="col-span-3">Last Logged</span>
              <span class="col-span-3">Reps (1-35)</span>
              <span class="col-span-3">Weight / Plate (1-30)</span>
              <span class="col-span-1 text-center">Done</span>
            </div>

            ${ex.sets.map((s, sIndex) => `
              <div class="grid grid-cols-12 items-center gap-2 bg-slate-50 dark:bg-slate-900 p-2 rounded-lg border border-slate-200 dark:border-slate-700 ${s.completed ? 'bg-emerald-500/10 border-emerald-500/30' : ''}">
                <span class="col-span-2 font-bold text-xs text-amber-500">Set ${sIndex + 1}</span>
                <span class="col-span-3 text-xs text-slate-500 dark:text-slate-400 font-mono">${s.lastReps || '--'} reps × ${s.lastWeight || '--'}</span>
                
                <!-- Reps Dropdown (1 to 35) -->
                <select onchange="updateSetVal('${ex.id}', ${sIndex}, 'reps', this.value)" class="col-span-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded p-1.5 text-xs text-center font-bold text-slate-900 dark:text-white">
                  ${Array.from({ length: 35 }, (_, i) => i + 1).map(val => `<option value="${val}" ${parseInt(s.reps) === val ? 'selected' : ''}>${val}</option>`).join('')}
                </select>

                <!-- Weight / Plate Dropdown (1 to 30) -->
                <div class="col-span-3 flex items-center space-x-1">
                  <select onchange="updateSetVal('${ex.id}', ${sIndex}, 'weight', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded p-1.5 text-xs text-center font-bold text-slate-900 dark:text-white">
                    ${Array.from({ length: 30 }, (_, i) => i + 1).map(val => `<option value="${val}" ${parseInt(s.weight) === val ? 'selected' : ''}>${val}</option>`).join('')}
                  </select>
                  <button onclick="removeSet('${ex.id}', ${sIndex})" class="text-xs text-red-500 px-1">✕</button>
                </div>

                <!-- Set Completion Checkbox -->
                <div class="col-span-1 flex justify-center items-center">
                  <input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleSetComplete('${ex.id}', ${sIndex}, this.checked)" class="w-4 h-4 accent-amber-500 cursor-pointer rounded" title="Complete set & start rest timer" />
                </div>
              </div>
            `).join('')}

            <button onclick="addSet('${ex.id}')" class="w-full py-1.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-xs font-semibold rounded-lg text-slate-700 dark:text-slate-300">
              + Add Set
            </button>
          </div>

          <div>
            <textarea placeholder="Exercise notes..." onchange="updateExerciseNotes('${ex.id}', this.value)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded p-2 text-xs text-slate-900 dark:text-slate-200 focus:outline-none focus:border-amber-500" rows="2">${ex.notes || ''}</textarea>
          </div>
        </div>
      `).join('');
    }

    function toggleSetComplete(exId, sIndex, isChecked) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex && ex.sets[sIndex]) {
        ex.sets[sIndex].completed = isChecked;
        saveWorkoutDays(days);
        renderWorkoutEditor();
        if (isChecked) {
          resetTimer();
          startTimer();
        }
      }
    }

    function updateDayTitle(val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (day) { day.title = val; saveWorkoutDays(days); renderDashboard(); }
    }

    function addExerciseToActiveDay() {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (day) {
        day.exercises.push({
          id: 'ex_' + Date.now(),
          name: 'New Exercise',
          notes: '',
          superset: false,
          cableSides: 'None',
          cableHeight: 0,
          sets: [{ reps: 10, weight: 10, completed: false, lastReps: 10, lastWeight: 10 }]
        });
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function removeExercise(exId) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (day) {
        day.exercises = day.exercises.filter(e => e.id !== exId);
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function moveExercise(exId, dir) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (!day) return;
      const idx = day.exercises.findIndex(e => e.id === exId);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx >= 0 && targetIdx < day.exercises.length) {
        const temp = day.exercises[idx];
        day.exercises[idx] = day.exercises[targetIdx];
        day.exercises[targetIdx] = temp;
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function toggleSuperset(exId) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex.superset = !ex.superset; saveWorkoutDays(days); renderWorkoutEditor(); }
    }

    function updateCableSetting(exId, key, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex[key] = val; saveWorkoutDays(days); }
    }

    function updateExerciseNotes(exId, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex.notes = val; saveWorkoutDays(days); }
    }

    function updateExerciseName(exId, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) { ex.name = val; saveWorkoutDays(days); }
    }

    function addSet(exId) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex) {
        const lastSet = ex.sets[ex.sets.length - 1] || { reps: 10, weight: 10 };
        ex.sets.push({ reps: lastSet.reps, weight: lastSet.weight, completed: false, lastReps: lastSet.reps, lastWeight: lastSet.weight });
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function removeSet(exId, sIndex) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex && ex.sets.length > 1) {
        ex.sets.splice(sIndex, 1);
        saveWorkoutDays(days);
        renderWorkoutEditor();
      }
    }

    function updateSetVal(exId, sIndex, key, val) {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      const ex = day?.exercises.find(e => e.id === exId);
      if (ex && ex.sets[sIndex]) {
        ex.sets[sIndex][key] = parseFloat(val) || 0;
        saveWorkoutDays(days);
      }
    }

    async function finishAndSaveWorkout() {
      const days = getWorkoutDays();
      const day = days.find(d => d.id === activeDayId);
      if (!day) return;

      day.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          s.lastReps = s.reps;
          s.lastWeight = s.weight;
          s.completed = false; // Reset completion state for future sessions
        });
      });
      saveWorkoutDays(days);

      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      history.unshift({
        title: day.title,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        exercises: JSON.parse(JSON.stringify(day.exercises))
      });
      localStorage.setItem('workout_history', JSON.stringify(history));

      downloadLocalBackup();
      renderHistory();
      renderWorkoutEditor();

      let backupStatus = "Saved locally & local JSON backup downloaded.";

      if (window.gapi && gapi.client && gapi.client.getToken()) {
        try {
          await syncWithDrive();
          backupStatus = "Successfully saved locally, backed up to Google Drive (App Data & Root Folder), and downloaded JSON backup!";
        } catch(e) {
          backupStatus = "Saved locally & downloaded JSON backup, but Google Drive sync failed.";
        }
      }

      alert(`🎉 Workout Completed!\n\n${backupStatus}`);
    }

    let creatineIntake = localStorage.getItem('creatineIntake') || '0g';

    function updateCreatineUI() {
      const btn = document.getElementById('creatine-btn');
      btn.innerText = `Logged: ${creatineIntake}`;
      if (creatineIntake !== '0g') {
        btn.classList.remove('bg-slate-200', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-300');
        btn.classList.add('bg-amber-500', 'text-slate-900');
      } else {
        btn.classList.remove('bg-amber-500', 'text-slate-900');
        btn.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-300');
      }
    }

    function toggleCreatine() {
      if (creatineIntake === '0g') creatineIntake = '3g';
      else if (creatineIntake === '3g') creatineIntake = '5g';
      else creatineIntake = '0g';

      localStorage.setItem('creatineIntake', creatineIntake);
      updateCreatineUI();
      if (window.gapi && gapi.client && gapi.client.getToken()) syncWithDrive();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      const container = document.getElementById('history-list');

      if (history.length === 0) {
        container.innerHTML = `<div class="p-6 text-center bg-white dark:bg-slate-800 rounded-xl text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700">No workout logs stored yet.</div>`;
        return;
      }

      container.innerHTML = history.map(h => `
        <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2 shadow-sm">
          <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-2">
            <h3 class="font-bold text-amber-500">${h.title}</h3>
            <span class="text-xs text-slate-400">${h.date}</span>
          </div>
          <div class="text-xs space-y-1 text-slate-600 dark:text-slate-300">
            ${h.exercises.map(e => `
              <div class="flex justify-between">
                <span>• ${e.name} ${e.cableHeight !== undefined ? `<span class="text-slate-400 text-[10px]">(Pin ${e.cableHeight})</span>` : ''}</span>
                <span class="font-mono text-slate-400">${e.sets.map(s => `${s.reps}x${s.weight}`).join(', ')}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm('Clear all recorded history?')) {
        localStorage.removeItem('workout_history');
        renderHistory();
      }
    }

    function openSettingsModal() {
      document.getElementById('setting-client-id').value = localStorage.getItem('google_client_id') || '';
      document.getElementById('setting-api-key').value = localStorage.getItem('google_api_key') || '';
      document.getElementById('settings-modal').classList.remove('hidden');
      updateSyncStatusUI();
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function updateSyncStatusUI(status = 'idle', message = '', time = '') {
      const box = document.getElementById('sync-status-box');
      const icon = document.getElementById('sync-status-icon');
      const text = document.getElementById('sync-status-text');
      const timeSpan = document.getElementById('sync-last-time');
      const hasCreds = localStorage.getItem('google_client_id') && localStorage.getItem('google_api_key');

      box.className = "p-3 rounded-lg border text-xs flex items-center justify-between ";

      if (status === 'syncing') {
        box.classList.add('bg-amber-500/10', 'border-amber-500/30');
        icon.innerText = '🔄';
        text.innerText = 'Drive Sync: Syncing in progress...';
      } else if (status === 'success') {
        box.classList.add('bg-emerald-500/10', 'border-emerald-500/30');
        icon.innerText = '🟢';
        text.innerText = 'Drive Sync: Connected & Up-to-date';
      } else if (status === 'error') {
        box.classList.add('bg-red-500/10', 'border-red-500/30');
        icon.innerText = `Drive Sync Error: ${message || 'Failed'}`;
      } else {
        if (hasCreds) {
          box.classList.add('bg-emerald-500/10', 'border-emerald-500/30');
          icon.innerText = '🟢';
          text.innerText = 'Drive Sync: Ready';
        } else {
          box.classList.add('bg-slate-100', 'dark:bg-slate-900', 'border-slate-200', 'dark:border-slate-700');
          icon.innerText = '⚪';
          text.innerText = 'Drive Sync: Not Configured';
        }
      }

      if (time) timeSpan.innerText = time;
    }

    function saveSettings() {
      const clientId = document.getElementById('setting-client-id').value.trim();
      const apiKey = document.getElementById('setting-api-key').value.trim();
      localStorage.setItem('google_client_id', clientId);
      localStorage.setItem('google_api_key', apiKey);
      closeSettingsModal();
      initGoogleAuth();
    }

    function downloadLocalBackup() {
      const payload = getPayload();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `heavyduty_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
    }

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    function gapiLoaded() { gapiInited = true; initGoogleAuth(); }
    function gisLoaded() { gisInited = true; initGoogleAuth(); }

    function initGoogleAuth() {
      const clientId = localStorage.getItem('google_client_id');
      const apiKey = localStorage.getItem('google_api_key');

      if (!clientId || !apiKey || !gapiInited || !gisInited) return;

      try {
        gapi.client.init({
          apiKey: apiKey,
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
        }).then(() => {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata',
            callback: '',
          });
          document.getElementById('sync_button').classList.remove('hidden');
        });
      } catch(err) {
        console.error('Google Auth Init Error:', err);
      }
    }

    function getPayload() {
      return {
        workoutDays: getWorkoutDays(),
        history: JSON.parse(localStorage.getItem('workout_history') || '[]'),
        creatineIntake: localStorage.getItem('creatineIntake') || '0g',
        lastUpdated: new Date().toISOString()
      };
    }

    function applyPayload(payload) {
      if (payload.workoutDays) saveWorkoutDays(payload.workoutDays);
      if (payload.history) localStorage.setItem('workout_history', JSON.stringify(payload.history));
      if (payload.creatineIntake) {
        localStorage.setItem('creatineIntake', payload.creatineIntake);
        creatineIntake = payload.creatineIntake;
        updateCreatineUI();
      }
      renderDashboard();
      renderHistory();
      renderWorkoutEditor();
    }

    async function fetchCloudData(accessToken) {
      const listRes = await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder", {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const listData = await listRes.json();
      const file = listData.files?.find(f => f.name === 'heavydutysteve_v3.json');
      if (!file) return null;

      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      return await fileRes.json();
    }

    function getLastWorkoutDate(historyArray) {
      if (!historyArray || historyArray.length === 0) return null;
      return new Date(historyArray[0].date);
    }

    function promptConflictResolution(localPayload, cloudPayload, onResolve) {
      const localHistory = localPayload.history || [];
      const cloudHistory = cloudPayload.history || [];

      const localDate = getLastWorkoutDate(localHistory);
      const cloudDate = getLastWorkoutDate(cloudHistory);

      const localDateStr = localDate ? localDate.toLocaleDateString() : 'No workouts';
      const cloudDateStr = cloudDate ? cloudDate.toLocaleDateString() : 'No workouts';

      document.getElementById('conflict-local-date').innerText = localDateStr;
      document.getElementById('conflict-local-count').innerText = `${localHistory.length} sessions logged`;

      document.getElementById('conflict-cloud-date').innerText = cloudDateStr;
      document.getElementById('conflict-cloud-count').innerText = `${cloudHistory.length} sessions logged`;

      let diffText = 'Both datasets differ.';
      if (localDate && cloudDate) {
        const diffDays = Math.round(Math.abs((localDate - cloudDate) / (1000 * 60 * 60 * 24)));
        if (diffDays === 0) diffText = 'Both versions have workouts from the same day, but contain different entries.';
        else diffText = `Difference: The ${localDate > cloudDate ? 'Local' : 'Cloud'} version has a workout that is ${diffDays} day(s) newer.`;
      }
      document.getElementById('conflict-diff-summary').innerText = diffText;

      const modal = document.getElementById('conflict-modal');
      modal.classList.remove('hidden');

      document.getElementById('btn-use-local').onclick = () => {
        modal.classList.add('hidden');
        onResolve('local');
      };
      document.getElementById('btn-use-cloud').onclick = () => {
        modal.classList.add('hidden');
        onResolve('cloud');
      };
    }

    async function syncWithDrive() {
      if (!tokenClient) { openSettingsModal(); return; }

      updateSyncStatusUI('syncing');

      tokenClient.callback = async (resp) => {
        if (resp.error) {
          updateSyncStatusUI('error', resp.error);
          return;
        }

        const accessToken = gapi.client.getToken().access_token;
        const localPayload = getPayload();

        try {
          const cloudPayload = await fetchCloudData(accessToken);

          if (cloudPayload && JSON.stringify(localPayload) !== JSON.stringify(cloudPayload)) {
            promptConflictResolution(localPayload, cloudPayload, async (choice) => {
              if (choice === 'cloud') {
                applyPayload(cloudPayload);
                updateSyncStatusUI('success', '', new Date().toLocaleTimeString());
              } else {
                await uploadToCloud(accessToken, localPayload);
              }
            });
          } else {
            await uploadToCloud(accessToken, localPayload);
          }
        } catch (e) {
          console.error(e);
          updateSyncStatusUI('error', 'Sync network error');
        }
      };

      if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    async function uploadSingleFile(accessToken, payload, parentFolder = 'appDataFolder') {
      const fileName = 'heavydutysteve_v3.json';

      // Check existing file in the given parent location
      const query = parentFolder === 'root' 
        ? `'root' in parents and name = '${fileName}' and trashed = false`
        : `'appDataFolder' in parents and name = '${fileName}' and trashed = false`;

      const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&spaces=${parentFolder}`, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });
      const searchData = await searchRes.json();
      const existingFile = searchData.files?.[0];

      const file = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const metadata = { name: fileName };
      if (!existingFile) metadata.parents = [parentFolder];

      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', file);

      const url = existingFile 
        ? `https://www.googleapis.com/upload/drive/v3/files/${existingFile.id}?uploadType=multipart`
        : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';

      return await fetch(url, {
        method: existingFile ? 'PATCH' : 'POST',
        headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
        body: form
      });
    }

    async function uploadToCloud(accessToken, payload) {
      try {
        // Upload to appDataFolder (hidden application data folder)
        const appDataRes = await uploadSingleFile(accessToken, payload, 'appDataFolder');
        // Upload to root folder (visible main Google Drive folder)
        const rootRes = await uploadSingleFile(accessToken, payload, 'root');

        if (appDataRes.ok && rootRes.ok) {
          updateSyncStatusUI('success', '', new Date().toLocaleTimeString());
        } else {
          updateSyncStatusUI('error', 'Upload failed on one or more destinations');
        }
      } catch(err) {
        console.error(err);
        updateSyncStatusUI('error', 'Cloud sync upload error');
      }
    }

    function switchTab(targetTab) {
      const navButtons = document.querySelectorAll('.nav-btn');
      const tabContents = document.querySelectorAll('.tab-content');

      navButtons.forEach(btn => {
        if (btn.getAttribute('data-tab') === targetTab) {
          btn.classList.add('bg-amber-500', 'text-slate-900');
          btn.classList.remove('text-slate-600', 'dark:text-slate-400');
        } else {
          btn.classList.remove('bg-amber-500', 'text-slate-900');
          btn.classList.add('text-slate-600', 'dark:text-slate-400');
        }
      });

      tabContents.forEach(content => {
        if (content.id === targetTab) {
          content.classList.add('active');
        } else {
          content.classList.remove('active');
        }
      });

      if (targetTab === 'dashboard') renderDashboard();
      if (targetTab === 'workout') renderWorkoutEditor();
      if (targetTab === 'history') renderHistory();
    }

    document.querySelectorAll('.nav-btn').forEach(button => {
      button.addEventListener('click', () => {
        const targetTab = button.getAttribute('data-tab');
        switchTab(targetTab);
      });
    });

    initTheme();
    updateCreatineUI();
    renderDashboard();
    renderHistory();
    updateTimerDisplay();
  </script>
</body>
</html>
