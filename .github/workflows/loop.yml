name: Cryptoanalyst Automated Loop

on:
  schedule:
    - cron: "17 6 * * *"   # Fallback daily cron at off-peak minute :17 UTC
  workflow_dispatch: {}      # Primary reliable trigger via external cron / API

concurrency:
  group: cryptoanalyst-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute intelligence engine & alert dispatcher
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python run.py

      - name: Commit updated dashboard data and state
        run: |
          git config user.name "cryptoanalyst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): automated intelligence & alert run [skip ci]"
            git push
          fi
