name: G loop
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the loop
        run: node server/run.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GLASSNODE_KEY: ${{ secrets.GLASSNODE_KEY }}
      - name: Commit results
        run: |
          git config user.name "g-loop"
          git config user.email "g-loop@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "G loop update" && git push)









