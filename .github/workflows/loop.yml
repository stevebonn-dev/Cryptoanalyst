name: G loop
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check files
        run: |
          ls -la
          for f in index.html config.json server/run.js; do
            if [ -f "$f" ]; then echo "found $f"; else echo "MISSING $f"; fi
          done
      - name: Run the loop
        run: node server/run.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GLASSNODE_KEY: ${{ secrets.GLASSNODE_KEY }}
      - name: Commit results
        run: |
          git config user.name "g-loop"
          git config user.email "g-loop@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "G loop update" && git push)
